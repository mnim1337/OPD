[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-scanner"
version = "0.5.0"
description = "Оценка алгоритмов маршрутизации в многоспутниковых системах связи"
requires-python = ">=3.12"
dependencies = ["PySide6_Essentials==6.12.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
opd = "scanner.cli:main"
opd-gui = "scanner.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
